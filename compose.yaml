services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forecast
      POSTGRES_PASSWORD: forecast
      POSTGRES_DB: forecast
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forecast -d forecast"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      target: app
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      GATEWAY_HOST: gateway
    volumes:
      - experiments_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: .
      target: gateway
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  ingestion:
    build:
      context: .
      target: ingestion
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  experiments_data:
