[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eforecast"
version = "0.2.0"
description = "E-Forecast — Prophet-based market forecasting platform"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["forecast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Query() defaults are idiomatic, not a bug.
# E501: line length is a formatter concern, not a lint error.
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
# Streamlit UI: dense layout code, and env loading must precede imports.
"app.py" = ["E402", "E701", "E702", "E731"]

[tool.ruff.lint.isort]
known-first-party = ["forecast"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
